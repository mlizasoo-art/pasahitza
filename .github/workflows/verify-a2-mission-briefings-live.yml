name: Verify Mission Briefing transcript gates live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-a2-mission-briefings-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify live Mission Briefing transcript flow
        shell: bash
        run: |
          set -euo pipefail
          base='https://mlizasoo-art.github.io/pasahitza/ad-exposed-preview'
          mkdir -p /tmp/adex-live output/qa

          wait_for_page() {
            local url="$1" file="$2" marker="$3"
            for i in $(seq 1 30); do
              if curl -fLsS -H 'Cache-Control: no-cache' "${url}?qa=transcript-v1-${i}" -o "$file"; then
                if grep -Fq "$marker" "$file"; then return 0; fi
              fi
              sleep 10
            done
            echo "Live page did not converge: $url" >&2
            return 1
          }

          wait_for_page "$base/AdExposed-Ramp1-Recruit-Briefing.dc.html" /tmp/adex-live/r1.html 'id="mb01-transmission-audio-transcript-shell"'
          wait_for_page "$base/AdExposed-Ramp2-Decode-Briefing.dc.html" /tmp/adex-live/r2.html 'id="mb02-transmission-audio-transcript-shell"'
          wait_for_page "$base/AdExposed-Ramp3-Expose-Briefing.dc.html" /tmp/adex-live/r3.html 'id="mb03-transmission-audio-transcript-shell"'
          wait_for_page "$base/AdExposed-Ramp4-Create-Briefing.dc.html" /tmp/adex-live/r4.html 'id="mb04-transmission-audio-transcript-shell"'

          for n in 1 2 3 4; do
            f="/tmp/adex-live/r${n}.html"
            grep -Fq 'const requiredPlays = 2;' "$f"
            grep -Fq 'Locked · complete 2 full listens first (0/2)' "$f"
            grep -Fq 'Unlocked · read the transcript and listen again.' "$f"
            grep -Fq 'localStorage.setItem(storageKey, String(plays))' "$f"
            grep -Fq 'Read + listen again' "$f"
            ! grep -Eqi '<audio[^>]*[[:space:]]autoplay([[:space:]=>])' "$f"
          done

          grep -Fq 'id="mb01-transmission-audio-transcript-replay"' /tmp/adex-live/r1.html
          grep -Fq 'id="mb02-transmission-audio-transcript-replay"' /tmp/adex-live/r2.html
          grep -Fq 'id="mb03-transmission-audio-transcript-replay"' /tmp/adex-live/r3.html
          grep -Fq 'id="mb04-transmission-audio-transcript-replay"' /tmp/adex-live/r4.html

          grep -Fq 'Recruit, this is Director Webb from SIGNAL Intelligence Unit.' /tmp/adex-live/r1.html
          grep -Fq 'Welcome to DECODE, Analyst.' /tmp/adex-live/r2.html
          grep -Fq 'Ethics Division Reviewer — Mission Briefing' /tmp/adex-live/r3.html
          grep -Fq 'Is the advert fair and responsible?' /tmp/adex-live/r3.html
          grep -Fq 'The Client — Final Commission' /tmp/adex-live/r4.html
          grep -Fq 'Make something SIGNAL can support.' /tmp/adex-live/r4.html

          cat > output/qa/AD-EXPOSE-MISSION-TRANSCRIPTS-LIVE.json <<EOF
          {
            "schema_version": "ad-expose-mission-transcripts-live/v1",
            "status": "PASS",
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "base_url": "$base",
            "required_complete_plays": 2,
            "progress_storage": "localStorage",
            "skip_forward_counts": false,
            "transcript_after_unlock": true,
            "replay_while_reading": true,
            "autoplay": false,
            "ramps": {
              "recruit": "PASS",
              "decode": "PASS",
              "expose": "PASS_DISTINCT_ETHICS_REVIEWER",
              "create": "PASS"
            },
            "mission_audio_bytes_changed": false,
            "listening_practice_changed": false
          }
          EOF
          echo 'MISSION_BRIEFING_TRANSCRIPTS_LIVE=PASS'

      - name: Persist live QA evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ad-expose-live-qa[bot]'
          git config user.email 'ad-expose-live-qa@users.noreply.github.com'
          git add output/qa/AD-EXPOSE-MISSION-TRANSCRIPTS-LIVE.json
          if git diff --cached --quiet; then
            echo 'Live QA evidence already current.'
          else
            git commit -m 'qa: record Mission Briefing transcript gates live PASS'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
