name: Verify A2 Mission Briefings live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-a2-mission-briefings-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify live GitHub Pages Mission Briefings
        shell: bash
        run: |
          set -euo pipefail
          base='https://mlizasoo-art.github.io/pasahitza/ad-exposed-preview'
          mkdir -p /tmp/adex-live output/qa

          wait_for_asset() {
            local url="$1" file="$2" sha="$3" size="$4"
            for i in $(seq 1 30); do
              if curl -fLsS -H 'Cache-Control: no-cache' "${url}?qa=403f5176-${i}" -o "$file"; then
                got_size=$(stat --format=%s "$file")
                got_sha=$(sha256sum "$file" | awk '{print $1}')
                if [ "$got_size" = "$size" ] && [ "$got_sha" = "$sha" ]; then
                  return 0
                fi
              fi
              sleep 10
            done
            echo "Live asset did not converge: $url" >&2
            echo "size=$(stat --format=%s "$file" 2>/dev/null || echo missing) sha=$(sha256sum "$file" 2>/dev/null | awk '{print $1}' || true)" >&2
            return 1
          }

          wait_for_asset "$base/assets/director-webb-recruit-briefing.mp3" /tmp/adex-live/webb.mp3 657f76613b76444b538fd6b9371f66ce6ebc84c9fdc34a1d76d35eb2c8795532 955053
          wait_for_asset "$base/assets/dr-lena-vasquez-decode-briefing.mp3" /tmp/adex-live/decode.mp3 efa58b1b3d699702cbe28e29f1bec0f5dbc103a69d476c4419e69dd8b2560cd2 698871
          wait_for_asset "$base/assets/dr-lena-vasquez-expose-ethics-briefing.mp3" /tmp/adex-live/expose.mp3 b5576a0deb5b3326d5115339459f236ccd98b58df18628bb7b5a8e08a9645d01 756132
          wait_for_asset "$base/assets/the-client-final-commission.mp3" /tmp/adex-live/create.mp3 704776e139803b2b1f48c5de300848725655febb7fd4de5a6cd216f7dd6c3e84 710992

          curl -fLsS -H 'Cache-Control: no-cache' "$base/AdExposed-Ramp2-Decode-Briefing.dc.html?qa=403f5176" -o /tmp/adex-live/r2.html
          curl -fLsS -H 'Cache-Control: no-cache' "$base/AdExposed-Ramp3-Expose-Briefing.dc.html?qa=403f5176" -o /tmp/adex-live/r3.html
          curl -fLsS -H 'Cache-Control: no-cache' "$base/AdExposed-Ramp4-Create-Briefing.dc.html?qa=403f5176" -o /tmp/adex-live/r4.html

          grep -Fq 'id="mb02-transmission-audio" controls="{{ true }}" src="./assets/dr-lena-vasquez-decode-briefing.mp3"' /tmp/adex-live/r2.html
          grep -Fq 'id="mb03-transmission-audio" controls="{{ true }}" src="./assets/dr-lena-vasquez-expose-ethics-briefing.mp3"' /tmp/adex-live/r3.html
          grep -Fq 'id="mb04-transmission-audio" controls="{{ true }}" src="./assets/the-client-final-commission.mp3"' /tmp/adex-live/r4.html
          ! grep -Eqi '<audio[^>]*[[:space:]]autoplay([[:space:]=>])' /tmp/adex-live/r2.html /tmp/adex-live/r3.html /tmp/adex-live/r4.html

          cat > output/qa/AD-EXPOSE-A2-MISSION-BRIEFINGS-LIVE.json <<EOF
          {
            "schema_version": "ad-expose-a2-mission-briefings-live/v1",
            "status": "PASS",
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "base_url": "$base",
            "delivery_profile": {
              "language_level": "A2",
              "rate_multiplier": 0.88,
              "sentence_pause_seconds": 1,
              "major_pause_every_sentences": 3,
              "major_pause_seconds": 2
            },
            "assets": {
              "webb": {"sha256": "657f76613b76444b538fd6b9371f66ce6ebc84c9fdc34a1d76d35eb2c8795532", "size_bytes": 955053, "regenerated": false},
              "decode": {"sha256": "efa58b1b3d699702cbe28e29f1bec0f5dbc103a69d476c4419e69dd8b2560cd2", "size_bytes": 698871},
              "expose": {"sha256": "b5576a0deb5b3326d5115339459f236ccd98b58df18628bb7b5a8e08a9645d01", "size_bytes": 756132},
              "create": {"sha256": "704776e139803b2b1f48c5de300848725655febb7fd4de5a6cd216f7dd6c3e84", "size_bytes": 710992}
            },
            "pages": {
              "r2_player": "PASS",
              "r3_player": "PASS",
              "r4_player": "PASS",
              "autoplay": false
            },
            "practice_listenings_changed": false
          }
          EOF
          echo 'A2_MISSION_BRIEFINGS_LIVE=PASS'

      - name: Persist live QA evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ad-expose-live-qa[bot]'
          git config user.email 'ad-expose-live-qa@users.noreply.github.com'
          git add output/qa/AD-EXPOSE-A2-MISSION-BRIEFINGS-LIVE.json
          if git diff --cached --quiet; then
            echo 'Live QA evidence already current.'
          else
            git commit -m 'qa: record A2 Mission Briefings live PASS'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
