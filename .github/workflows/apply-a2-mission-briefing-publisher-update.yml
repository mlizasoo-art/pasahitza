name: Apply A2 Mission Briefing publisher update

on:
  push:
    branches: [feat/ad-exposed-a2-mission-briefings]
    paths:
      - '.github/workflows/apply-a2-mission-briefing-publisher-update.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ad-exposed-a2-mission-briefings
          fetch-depth: 0
      - name: Update publisher hashes and sizes
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/publish-ad-exposed.yml')
          s = p.read_text()
          replacements = {
            '4bc227e2a0bb17e6ae76cff710895dbb9bff191757b973c81c2535eb29221336': 'efa58b1b3d699702cbe28e29f1bec0f5dbc103a69d476c4419e69dd8b2560cd2',
            '5b282ae55ad4b4877de18a9ad538f2986d207fb6d22799c3ebf6c87a173ba576': 'b5576a0deb5b3326d5115339459f236ccd98b58df18628bb7b5a8e08a9645d01',
            '05b682c3cbab84e245c8b9a9c3566a2d57862ad236b5ad2ef641ff7569d41104': '704776e139803b2b1f48c5de300848725655febb7fd4de5a6cd216f7dd6c3e84',
            '"$out/assets/dr-lena-vasquez-decode-briefing.mp3")" -eq 411733': '"$out/assets/dr-lena-vasquez-decode-briefing.mp3")" -eq 698871',
            '"$out/assets/dr-lena-vasquez-expose-ethics-briefing.mp3")" -eq 536285': '"$out/assets/dr-lena-vasquez-expose-ethics-briefing.mp3")" -eq 756132',
            '"$out/assets/the-client-final-commission.mp3")" -eq 469830': '"$out/assets/the-client-final-commission.mp3")" -eq 710992',
          }
          for old, new in replacements.items():
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one publisher occurrence for {old}, found {count}')
            s = s.replace(old, new)
          p.write_text(s)
          print('A2_PUBLISHER_HASH_UPDATE=PASS')
      - name: Commit durable publisher update and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ad-expose-a2-publisher[bot]'
          git config user.email 'ad-expose-a2-publisher@users.noreply.github.com'
          git add .github/workflows/publish-ad-exposed.yml
          git rm .github/workflows/apply-a2-mission-briefing-publisher-update.yml
          git commit -m 'fix: publish A2-paced AD EXPOSE Mission Briefings'
          git pull --rebase origin feat/ad-exposed-a2-mission-briefings
          git push origin HEAD:feat/ad-exposed-a2-mission-briefings
