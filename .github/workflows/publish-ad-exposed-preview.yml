name: Publish AD EXPOSE static preview

on:
  push:
    paths:
      - '.github/workflows/publish-ad-exposed-preview.yml'
      - 'docs/ad-exposed-preview-trigger.txt'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/ad-exposed-preview-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Materialize AD EXPOSE as ordinary static files
        shell: bash
        run: |
          set -euo pipefail
          out='ad-exposed-preview'
          base='https://unidades-app.vercel.app/ad-exposed/site'
          briefing="$out/AdExposed-Ramp1-Recruit-Briefing.dc.html"
          local_webb='./assets/director-webb-recruit-briefing.mp3'
          target="$out/assets/director-webb-recruit-briefing.mp3"
          webb_primary='https://fsxozhthibraurgvsxtw.supabase.co/storage/v1/object/public/audio/f4ccb9e2-f32d-493d-97fb-a138703f9d28/session_1_audio.mp3'
          webb_fallback='https://unidades-app.vercel.app/api/audio/f4ccb9e2-f32d-493d-97fb-a138703f9d28/1'
          expected_sha='657f76613b76444b538fd6b9371f66ce6ebc84c9fdc34a1d76d35eb2c8795532'
          expected_size='955053'

          rm -rf "$out"
          mkdir -p "$out/assets"
          files=(
            'AdExposed-Hub.dc.html'
            'AdExposed-Ramp1-Recruit-Briefing.dc.html'
            'AdExposed-Ramp1-Recruit-Checkpoint.dc.html'
            'AdExposed-Ramp1-Recruit-Drill.dc.html'
            'AdExposed-Ramp1-Recruit-LanguageFile.dc.html'
            'AdExposed-Ramp1-Recruit-Practice.dc.html'
            'AdExposed-Ramp1-Recruit-WhoWhatWhom.dc.html'
            'AdExposed-Ramp2-Decode-Briefing.dc.html'
            'AdExposed-Ramp2-Decode-Checkpoint.dc.html'
            'AdExposed-Ramp2-Decode-Practice.dc.html'
            'AdExposed-Ramp3-Expose-Briefing.dc.html'
            'AdExposed-Ramp3-Expose-Checkpoint.dc.html'
            'AdExposed-Ramp3-Expose-Practice.dc.html'
            'AdExposed-Ramp4-Create-Briefing.dc.html'
            'AdExposed-Ramp4-Create-Checkpoint.dc.html'
            'AdExposed-Ramp4-Create-Practice.dc.html'
            'support.js'
            'image-slot.js'
            'adexposed-shared.js'
            'adexposed-drill.js'
          )
          for f in "${files[@]}"; do
            echo "Fetching $f"
            curl --fail --location --retry 3 --retry-delay 2 "$base/$f" -o "$out/$f"
            test -s "$out/$f"
          done

          echo 'Fetching locked Webb Gold asset'
          if ! curl --fail --location --retry 3 --retry-delay 2 "$webb_primary" -o "$target"; then
            echo 'Primary object unavailable; using locked legacy build source'
            curl --fail --location --retry 3 --retry-delay 2 "$webb_fallback" -o "$target"
          fi
          echo "$expected_sha  $target" | sha256sum --check --strict
          test "$(stat --format=%s "$target")" -eq "$expected_size"

          python3 - "$briefing" "$local_webb" <<'PY'
          from pathlib import Path
          import re, sys

          path = Path(sys.argv[1])
          local_webb = sys.argv[2]
          text = path.read_text(encoding='utf-8')

          audio_patterns = [
              r'src="/api/audio/f4ccb9e2-f32d-493d-97fb-a138703f9d28/1"',
              r'src="https://fsxozhthibraurgvsxtw\.supabase\.co/storage/v1/object/public/audio/f4ccb9e2-f32d-493d-97fb-a138703f9d28/session_1_audio\.mp3"',
          ]
          replaced = 0
          for pattern in audio_patterns:
              text, count = re.subn(pattern, f'src="{local_webb}"', text)
              replaced += count
          if replaced == 0 and f'src="{local_webb}"' not in text:
              raise SystemExit('Webb audio source not found in recovered briefing')

          # Contract: HIDDEN_FROM_LEARNER. Remove the recovered Claude Design transcript UI.
          text = re.sub(
              r'<div style="margin-top:14px;">\s*<button[^>]*onClick="\{\{ onOpenTranscript \}\}"[^>]*>View transcript</button>\s*</div>',
              '', text, flags=re.S
          )
          text = re.sub(
              r'<sc-if value="\{\{ showTranscript \}\}"[^>]*>.*?</sc-if>',
              '', text, flags=re.S
          )
          path.write_text(text, encoding='utf-8')
          PY

          cp "$out/AdExposed-Hub.dc.html" "$out/index.html"
          touch "$out/.nojekyll"

          grep -q '<x-dc>' "$out/index.html"
          grep -q 'support.js' "$out/index.html"
          grep -q 'id="mb01-transmission-audio"' "$briefing"
          grep -q 'src="./assets/director-webb-recruit-briefing.mp3"' "$briefing"
          ! grep -q 'View transcript' "$briefing"
          ! grep -q 'MB-01 · Transcript' "$briefing"
          test -s "$target"
          echo 'STATIC_PREVIEW_AUDIO_GOLD=PASS'

      - name: Commit isolated preview to current branch
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}'
          git config user.name 'ad-expose-preview[bot]'
          git config user.email 'ad-expose-preview@users.noreply.github.com'
          git add -- ad-exposed-preview
          if git diff --cached --quiet; then
            echo 'No preview changes to commit.'
            exit 0
          fi
          git commit -m 'feat: publish AD EXPOSE with locked local Webb audio'
          git push origin "HEAD:${branch}"
